<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BAB Staff Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{
  
  --ground:#F0EBE6;
  --dot:rgba(44,44,58,.11);
  --surface:#FFFFFF;
  --ink:#2C2C3A;
  --ink-2:#5C5C6B;
  --ink-3:#8A8A97;
  --line:rgba(44,44,58,.13);
  --line-soft:rgba(44,44,58,.095);

  --rail:#004B4E;      /* logo teal  */
  --rail-2:#0B6265;
  --rail-ink:#E8F4F3;
  --rail-ink-2:#8FB6B6;
  --lime:#E2FE83;      /* logo lime  */

  /* severity ramp — validated for deutan/protan/tritan separation */
  --s0:#0E8F7D;   /* no pain            */
  --s1:#E9BE55;   /* 1–3                */
  --s2:#CE6A18;   /* 4–6                */
  --s3:#A3202F;   /* 7–10               */
  --s-none:rgba(44,44,58,.26);
  --bar:#0A7364;

  --coral:#EF545E;
  --coral-deep:#A3202F;
  --coral-tint:#FCEAEB;
  --amber-deep:#8A5A0A;
  --amber-tint:#FAF0DA;
  --lav:#5346C4;
  --lav-tint:#EFEDFD;

  --r:14px;
  --ease:cubic-bezier(.23,1,.32,1);
  --sans:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Bricolage Grotesque","Space Grotesk",ui-sans-serif,system-ui,sans-serif;
}

*{box-sizing:border-box}

body{
  margin:0;
  background-color:var(--ground);
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}

button{font:inherit;color:inherit}

/* ───────────────────────────── shell ───────────────────────────── */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}

/* ───────────────────────────── rail ────────────────────────────── */
.rail{
  background:var(--rail);
  color:var(--rail-ink);
  padding:22px 16px 18px;
  display:flex;flex-direction:column;gap:22px;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 4px}
.mark{display:block;width:74px;height:37px;border-radius:9px;flex:none;
  background:var(--logo) center/contain no-repeat}
.stf{
  font-size:10.5px;font-weight:500;color:var(--rail-ink-2);
  letter-spacing:.15em;text-transform:uppercase;
}

.nav{display:flex;flex-direction:column;gap:2px}
.nav a{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border-radius:9px;
  color:var(--rail-ink-2);text-decoration:none;font-size:13.5px;font-weight:500;
  transition:background 160ms var(--ease),color 160ms var(--ease);
}
.nav a svg{flex:none;opacity:.9}
.nav a.on{background:var(--rail-2);color:#fff}
.nav a.on svg{color:var(--lime);opacity:1}
.nav a.off{cursor:default;opacity:.62}
.nav a.off:hover{background:transparent}
@media (hover:hover) and (pointer:fine){.nav a:not(.off):not(.on):hover{background:rgba(255,255,255,.055);color:var(--rail-ink)}}
.soon-chip{
  margin-left:auto;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  padding:2.5px 7px;border-radius:99px;border:1px solid rgba(255,255,255,.24);color:var(--rail-ink-2);
}

.rail-sec{border-top:1px solid rgba(255,255,255,.11);padding-top:16px}
.rail-sec h3{
  margin:0 0 9px 11px;font-size:10px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(143,182,182,.8);font-family:var(--sans);
}
.soon{display:flex;flex-direction:column;gap:1px}
.soon div{
  padding:7px 11px;border-radius:8px;font-size:12.5px;color:var(--rail-ink-2);
  display:flex;align-items:center;gap:8px;cursor:default;
}
.soon div::before{
  content:"";width:5px;height:5px;border-radius:99px;flex:none;
  border:1px solid rgba(143,182,182,.55);
}
.soon div.key{color:#CFE4E3}
.soon div.key::before{background:var(--lime);border-color:var(--lime)}

.rail-foot{margin-top:auto;padding:0 11px;font-size:11.5px;color:rgba(143,182,182,.72);line-height:1.6}

/* ───────────────────────────── main ────────────────────────────── */
.main{padding:18px 22px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:2px 2px 0}
.top h1{font-family:var(--disp);font-size:27px;font-weight:700;letter-spacing:-.022em;margin:0}
.top .sub{color:var(--ink-2);font-size:13.5px;margin-top:1px}
.top .sub b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.who{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none}
.role{font-size:11.5px;color:var(--ink-2);white-space:nowrap;line-height:1}
.av{
  width:36px;height:36px;border-radius:99px;flex:none;background:var(--rail);color:var(--lime);
  display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.02em;
}

/* ───────────────────────────── today band ──────────────────────── */
.band{
  display:flex;flex-wrap:wrap;align-items:stretch;
  background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 0;animation:rise 420ms var(--ease) both;
}
.bseg{padding:1px 18px;min-width:0;border-left:1px solid var(--line)}
.bseg.datenav{display:flex;flex-direction:row;align-items:center;gap:9px;padding-top:0;padding-bottom:0}
.daylabel{
  font-family:var(--disp);font-weight:600;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;
}
.daynav{
  width:27px;height:27px;flex:none;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;
  transition:background 150ms var(--ease),border-color 150ms var(--ease),transform 130ms var(--ease);
}
@media (hover:hover) and (pointer:fine){.daynav:not([disabled]):hover{background:#F7F5F2;border-color:rgba(44,44,58,.28)}}
.daynav:not([disabled]):active{transform:scale(.94)}
.daynav[disabled]{opacity:.32;cursor:default}
.daynav:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
.bseg:first-child{border-left:0}
.bl{margin:0 0 3px;font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.bv{
  font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:-.008em;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
}
.bm{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink-2);letter-spacing:0}
.gauge{
  position:relative;display:inline-block;width:84px;height:7px;flex:none;
  border-radius:99px;background:rgba(44,44,58,.1);
}
.gfill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--rail)}
.gtick{position:absolute;top:-3.5px;bottom:-3.5px;width:2px;border-radius:2px;background:#fff;box-shadow:0 0 0 1px rgba(44,44,58,.5)}

/* ───────────────────────────── cards ───────────────────────────── */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 17px 5px;min-width:0;
  animation:rise 420ms var(--ease) both;
}
.card.pad{padding-bottom:12px}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.card:nth-of-type(1){animation-delay:0ms}
.grid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:14px;align-items:start}
.grid .card:first-child{animation-delay:60ms}
.grid .card:last-child{animation-delay:120ms}
@media (prefers-reduced-motion:reduce){.card{animation:none}}

.ch{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.ch h2{font-family:var(--disp);font-size:15.5px;font-weight:600;letter-spacing:-.012em;margin:0}
.ch .note{font-size:12.5px;color:var(--ink-2)}
.ch .note b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.ch .right{margin-left:auto;display:flex;align-items:center;gap:4px}

/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:-2px 0 12px;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:99px;display:block}

/* ───────────────────────────── table ───────────────────────────── */
.tw{overflow-x:auto;margin:0 -17px;padding:0 17px}
table{width:100%;border-collapse:collapse;min-width:760px}
thead th{
  text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;
  color:var(--ink-2);padding:0 12px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody tr{border-bottom:1px solid var(--line-soft);transition:background 140ms var(--ease)}
tbody tr:last-child{border-bottom:0}
@media (hover:hover) and (pointer:fine){tbody tr:hover{background:rgba(44,44,58,.028)}}
tbody tr.dim{opacity:.45}
tbody tr.lit{background:rgba(212,243,105,.2)}
td{padding:9px 12px 9px 0;vertical-align:middle}
td:last-child{padding-right:0}

.who-cell{cursor:pointer;min-width:152px}
.who-cell .n{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:-.008em;line-height:1.25}
.who-cell .p{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:1px}
@media (hover:hover) and (pointer:fine){.who-cell:hover .n{text-decoration:underline;text-underline-offset:2.5px;text-decoration-thickness:1.5px}}

.pill{
  display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:500;
  padding:3.5px 10px;border-radius:99px;border:1px solid;
}
.pill.ask{background:var(--coral);border-color:var(--coral);color:#fff;font-weight:700}
.pill.urg{background:var(--coral-tint);border-color:rgba(163,32,47,.3);color:var(--coral-deep)}
.pill.sil{background:var(--lav-tint);border-color:rgba(83,70,196,.26);color:var(--lav)}
.pill.wat{background:var(--amber-tint);border-color:rgba(138,90,10,.28);color:var(--amber-deep)}

.pain .z{font-weight:500;font-size:13.5px}
.pain .w{color:var(--ink-2);font-size:12.5px;margin-top:1px;font-variant-numeric:tabular-nums}
.pain .w em{font-style:normal;color:var(--ink);font-weight:500}

.strip{display:flex;gap:4px;align-items:center}
.d{width:11px;height:11px;border-radius:99px;flex:none;display:block}
.d.n{background:transparent;border:1.5px dashed var(--s-none)}

.nt{font-size:12.5px;color:var(--ink-2);max-width:215px;line-height:1.4}

thead th.soonhead{text-align:right;padding-right:0}
.th-soon{
  display:inline-block;font-size:9.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:3px 9px;border-radius:99px;
  border:1px dashed rgba(44,44,58,.3);background:rgba(44,44,58,.028);
}

.acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.btn{
  border:1px solid var(--line);background:var(--surface);border-radius:99px;
  padding:5.5px 13px;font-size:12px;font-weight:500;cursor:pointer;
  transition:background 150ms var(--ease),border-color 150ms var(--ease),transform 130ms var(--ease);
}
@media (hover:hover) and (pointer:fine){.btn:hover{background:#F7F5F2;border-color:rgba(44,44,58,.26)}}
.btn:active{transform:scale(.97)}
.btn.done{background:var(--rail);border-color:var(--rail);color:var(--lime);cursor:default}
.btn.done:active{transform:none}
.btn:focus-visible,.who-cell:focus-visible,.seg button:focus-visible,.zrow:focus-visible{
  outline:2px solid var(--lav);outline-offset:2px;border-radius:99px;
}

/* ────────────────────── missing check-in ───────────────────────── */
.miss{display:flex;flex-direction:column}
.miss .row{
  display:flex;align-items:center;gap:12px;padding:7px 0;
  border-bottom:1px solid var(--line-soft);
}
.miss .row:last-child{border-bottom:0}
.miss .txt{min-width:0;flex:1}
.miss .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.miss .hd .n{font-family:var(--disp);font-weight:600;font-size:13.5px}
.miss .hd .p{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.miss .sub{font-size:12.5px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}

/* ───────────────────────── team pains ──────────────────────────── */
.seg{display:inline-flex;background:rgba(44,44,58,.06);border-radius:99px;padding:2.5px}
.seg button{
  border:0;background:transparent;border-radius:99px;padding:4.5px 12px;
  font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;
  transition:background 160ms var(--ease),color 160ms var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(44,44,58,.1)}

.zones{display:flex;flex-direction:column;gap:2px}
.zgrid{display:grid;grid-template-columns:66px 100px minmax(0,1fr) 90px;align-items:center;gap:12px}
.zhead{
  padding:0 8px 7px;margin:0 -8px 4px;border-bottom:1px solid var(--line);
  font-size:10.5px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;color:var(--ink-2);
}
.zhead span:nth-child(4){text-align:right}
.zrow{
  padding:5px 8px;margin:0 -8px;
  border:0;background:transparent;width:calc(100% + 16px);
  text-align:left;border-radius:9px;cursor:pointer;
  transition:background 150ms var(--ease);
}
.zrow .za{font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.za b{font-weight:500}
.za i{display:none;font-style:normal;font-weight:400;color:var(--ink-2)}
.bnum{
  position:absolute;top:0;bottom:0;display:flex;align-items:center;
  font-size:12px;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums;
}
.bnum{right:9px;color:#fff}
@media (hover:hover) and (pointer:fine){.zrow:hover{background:rgba(44,44,58,.035)}}
.zrow[aria-pressed="true"]{background:rgba(212,243,105,.28)}
.zrow .zn{font-size:13.5px;font-weight:500}
.bartrack{position:relative;display:block;width:100%;height:20px;background:rgba(44,44,58,.055);border-radius:0 5px 5px 0}
.bar{position:relative;display:block;height:20px;min-width:32px;border-radius:0 5px 5px 0;background:var(--bar);transition:width 340ms var(--ease)}
.delta{font-size:12px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.delta.up{color:var(--coral-deep)}
.delta.dn{color:var(--s0)}
.delta.eq{color:var(--ink-3)}

/* ───────────────────────── slide-over ──────────────────────────── */
.scrim{
  position:fixed;inset:0;background:rgba(23,58,51,.34);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity 240ms var(--ease);z-index:40;
}
.scrim.on{opacity:1;pointer-events:auto}
.over{
  position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);
  background:var(--surface);border-left:1px solid var(--line);z-index:41;
  transform:translateX(100%);transition:transform 280ms cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
}
.over.on{transform:none}
#overc{display:flex;flex-direction:column;flex:1;min-height:0}
.over-h{flex:none}
.over-b{flex:1;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.over{overflow:hidden}
@media (prefers-reduced-motion:reduce){.over,.scrim{transition:none}}
.over-h{padding:20px 22px 15px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;gap:12px}
.over-h h3{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.over-h .p{font-size:12.5px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface);width:30px;height:30px;border-radius:99px;cursor:pointer;display:grid;place-items:center;flex:none;transition:background 150ms var(--ease)}
@media (hover:hover) and (pointer:fine){.x:hover{background:#F7F5F2}}
.over-b{padding:18px 22px 26px;overflow-y:auto;display:flex;flex-direction:column;gap:19px}
.lab{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.callout{
  background:var(--coral-tint);border:1px solid rgba(163,32,47,.22);border-radius:11px;padding:12px 14px;
  font-size:13px;line-height:1.5;color:var(--coral-deep);
}
.callout b{font-family:var(--disp);font-weight:700;display:block;margin-bottom:2px}
.words{display:flex;gap:6px;flex-wrap:wrap}
.word{font-size:12.5px;font-weight:500;padding:4px 11px;border-radius:99px;border:1px solid}
.word.t0{background:rgba(14,143,125,.09);border-color:rgba(14,143,125,.32);color:#0B6C5F}
.word.t1{background:var(--amber-tint);border-color:rgba(138,90,10,.28);color:var(--amber-deep)}
.word.t2{background:var(--coral-tint);border-color:rgba(163,32,47,.28);color:var(--coral-deep)}
.days{display:flex;gap:4px;align-items:flex-end;height:56px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.day .bx{width:100%;max-width:15px;border-radius:3px;background:var(--s-none)}
.day .dl{font-size:9px;color:var(--ink-3);letter-spacing:.02em}
.kv{display:flex;flex-direction:column;gap:0}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.kv div:last-child{border-bottom:0}
.kv span{color:var(--ink-2)}
.kv b{font-weight:500;text-align:right}

/* ───────────────────────── responsive ──────────────────────────── */
.mbar{display:none}
.alist{display:none}

@media (max-width:1140px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .nt{max-width:none}
}

/* ── phone & small tablet: the board becomes a single readable column ── */
@media (max-width:900px){
  .shell{display:flex;flex-direction:column;min-height:100vh}

  .mbar{
    display:flex;align-items:center;gap:11px;
    background:var(--rail);padding:11px 16px;
    position:sticky;top:0;z-index:20;
  }
  .mbar .mark{width:64px;height:32px}
  .mbar .stf{font-size:10px;font-weight:500;color:var(--rail-ink-2);letter-spacing:.15em;text-transform:uppercase}

  .main{order:1;padding:16px 16px 22px;gap:11px}

  /* the roadmap moves below the dashboard — value first, plans after */
  .rail{order:2;padding:20px 16px 24px;gap:16px}
  .rail .brand{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .nav a{padding:8px 13px;border:1px solid rgba(255,255,255,.14);border-radius:99px}
  .nav a.on{border-color:var(--rail-2)}
  .soon-chip{margin-left:6px}
  .rail-sec{border-top:1px solid rgba(255,255,255,.11);padding-top:16px}
  .rail-sec h3{margin-left:0}
  .soon{flex-direction:row;flex-wrap:wrap;gap:7px}
  .soon div{border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:6px 12px;font-size:12px}
  .rail-foot{margin-top:0;padding:0}

  .top h1{font-size:24px}
  .who{gap:4px}

  .band{flex-direction:column;gap:0;padding:4px 0}
  .bseg{border-left:0;border-top:1px solid var(--line-soft);padding:10px 16px}
  .bseg:first-child{border-top:0}

  .card{padding:14px 15px 13px}
  .card.pad{padding-bottom:13px}

  .tw{margin:0 -15px;padding:0 15px}
  .acard{padding:14px 0;border-bottom:1px solid var(--line-soft);transition:background 140ms var(--ease)}
  .acard:first-child{padding-top:2px}
  .acard:last-child{border-bottom:0;padding-bottom:2px}
  .acard.lit{background:rgba(226,254,131,.3)}
  .acard.dim{opacity:.45}
  .ahead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .acard .who-cell{min-width:0}
  .acard .pain{margin-top:8px}
  .acard .strip{margin-top:10px}
  .anote{margin:9px 0 0;font-size:13px;line-height:1.45;color:var(--ink-2)}
  .acard .acts{margin-top:11px;justify-content:flex-start}
  .d{width:13px;height:13px}
  .strip{gap:5px}

  .miss .row{flex-wrap:wrap;gap:8px 12px;padding:11px 0}
  .miss .txt{flex:1 1 210px}
  .btn{min-height:38px;padding:8px 15px;font-size:12.5px}

  /* zone rows: name + athletes on one line, bar + change beneath */
  .zhead{display:none}
  .zgrid.zrow{grid-template-columns:minmax(0,1fr) auto;row-gap:7px;gap:12px;padding:10px 8px}
  .zrow .zn{grid-area:1/1;font-size:14px}
  .zrow .za{grid-area:1/2;font-size:12.5px;color:var(--ink-2);text-align:right}
  .za i{display:inline}
  .zrow .bartrack{grid-area:2/1}
  .zrow .delta{grid-area:2/2}

  .over{width:100%;border-left:0}
  .over-h{padding:18px 18px 14px}
  .over-b{padding:16px 18px 30px}
}

@media (max-width:560px){
  .main{padding:14px 14px 20px}
  .top h1{font-size:22px}
  .top{gap:10px}
  .card{padding:13px 14px 12px}
  .tw{margin:0 -14px;padding:0 14px}
  .bseg{padding:9px 14px}
  .legend{gap:11px;font-size:11px}
  .acts{flex-wrap:wrap}
}

<script>
/* ================= Sample data: 9 months of BAB check-ins (structure as in the app) ================= */
const $=(s,r=document)=>r.querySelector(s);
const rnd=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(20261005);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),pick=a=>a[Math.floor(rnd()*a.length)];
const avg=x=>{x=x.filter(v=>v!=null);return x.length?x.reduce((s,v)=>s+v,0)/x.length:null};
const f1=n=>n==null?'–':n.toFixed(1),pct=n=>n==null?'–':Math.round(n*100)+'%';
const DAYS=274,D0=Date.UTC(2026,9,5);
const dt=i=>new Date(D0-i*864e5),dow=i=>(dt(i).getUTCDay()+6)%7;
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=i=>`${DOW[dow(i)]} ${dt(i).getUTCDate()} ${MON[dt(i).getUTCMonth()]}`;
const hhmm=h=>{const m=Math.round(h*60);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const WORDS={strong:{n:'Strong',s:'g',pos:1},light:{n:'Light',s:'g',pos:1},tight:{n:'Tight',s:'g'},sore:{n:'Sore',s:'g'},
  heavy:{n:'Heavy',s:'y'},crampy:{n:'Crampy',s:'y'},bloated:{n:'Bloated',s:'y'},sharp:{n:'Sharp',s:'r'},unstable:{n:'Unstable',s:'r'}};
const TIER={g:0,y:1,r:2};
const ZONES={kneeL:'Left knee',kneeR:'Right knee',ankleL:'Left ankle',ankleR:'Right ankle',thighL:'Left thigh',thighR:'Right thigh',calfL:'Left calf',calfR:'Right calf',heelL:'Left heel',heelR:'Right heel',hamL:'Left hamstring',hamR:'Right hamstring',lumbar:'Lower back',hip:'Hip',abdomen:'Abdomen',whole:'Whole body'};
const ZG={kneeL:'Knee',kneeR:'Knee',ankleL:'Ankle',ankleR:'Ankle',thighL:'Thigh',thighR:'Thigh',calfL:'Calf',calfR:'Calf',heelL:'Heel',heelR:'Heel',hamL:'Hamstring',hamR:'Hamstring',lumbar:'Lower back',hip:'Hip'};
const LIMB=Object.keys(ZG);
const TRIG=['movement','pressure','rest'];
const SEFF={Match:3,Strength:1.5,Speed:1.5,Tactical:.8,Recovery:.2,Activation:.3};
const ROUT=[{type:'Recovery',s:10,e:11.25},{type:'Strength',s:16,e:17.5},{type:'Speed',s:16,e:17.5},{type:'Tactical',s:16,e:17.75},{type:'Activation',s:11,e:12},null,null];
const MATCH=new Set();
for(let i=1;i<DAYS;i++){if(dow(i)===6&&Math.floor(i/7)%6!==5)MATCH.add(i);if(dow(i)===2&&i>4&&i<260&&Math.floor(i/7)%7===3)MATCH.add(i)}
const SESS=Array.from({length:DAYS+4},(_,i)=>MATCH.has(i)?(dow(i)===6?{type:'Match',s:15,e:16.75}:{type:'Match',s:18,e:19.75}):ROUT[dow(i)]);
const CONG=new Array(DAYS).fill(false);
MATCH.forEach(j=>{if([...MATCH].some(k=>k>j&&k-j<=4))for(let i=Math.max(0,j-3);i<=j;i++)CONG[i]=true});
const NEXT=[{i:-6,home:1,t:'15:00'},{i:-13,home:0,t:'15:00'},{i:-16,home:1,t:'18:00'},{i:-20,home:0,t:'15:00'}];
const NAMES=['Giulia Ferrante','Sara Bellandi','Chiara Montanari','Elisa Vaccari','Martina Orsi','Anna Cavalli','Beatrice Sartori','Federica Dallari','Laura Pizzetti','Silvia Ghidini','Alice Rastelli','Monica Zanichelli','Irene Bocchi','Valentina Lusardi','Camilla Mora','Francesca Tosi','Giada Pellegri','Noemi Scotti','Ilenia Baldini','Rebecca Fontana','Sofia Carraro','Emma Rinaldi','Lucrezia Bertoli','Aurora Ferri'];
const POS=['GK','GK','GK','DF','DF','DF','DF','DF','DF','DF','DF','MF','MF','MF','MF','MF','MF','MF','MF','FW','FW','FW','FW','FW'];
const ATH=NAMES.map((name,id)=>({id,name,pos:POS[id],age:13+Math.floor(rnd()*4),base:4.7+rnd()*1.1,p:.62+rnd()*.3,sens:.1+rnd()*1.6,frag:.012+rnd()*.03,weak:[pick(LIMB),pick(LIMB)],tau:14+rnd()*30,pms:rnd()<.35,ent:[],pk:new Set()}));
ATH[5].base=3.4;ATH[7].age=13;ATH[12].age=14;ATH[21].age=15;ATH[7].growth='heelR';ATH[12].growth='kneeR';
const median=a=>{const s=a.filter(v=>v!=null).sort((x,y)=>x-y);if(!s.length)return null;const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
/* period starts: regular cycles with small jitter, two irregular athletes, one with no period for 110+ days */
const IRR=new Set([9,17]),AMEN=new Set([21]);
ATH.forEach(a=>{if(a.age===13&&rnd()<.35)IRR.add(a.id)});
ATH.forEach(a=>{const L0=27+Math.floor(rnd()*6);let d=DAYS-1+Math.floor(rnd()*L0);a.ons=[];
  while(d>=0){if(AMEN.has(a.id)&&d<110)break;if(d<DAYS)a.ons.push(d);d-=Math.max(18,L0+(IRR.has(a.id)?Math.round((rnd()-.5)*20):Math.round((rnd()-.5)*4)))}});
const cdOf=(a,i)=>{let c=null;for(const o of a.ons){if(o>=i)c=o-i;else break}return c!=null&&c<=50?c:null};
const fat=i=>i<35?.5*(1-i/35):0;
function lastSess(i,t){for(let k=0;k<=2;k++){const S=SESS[i+k];if(!S)continue;const h=k*24+t-S.e;if(h>=0&&h<=60)return{type:S.type,h}}return null}
const HARD=new Set(['Match','Strength','Speed']);
function lastHard(i,t){for(let k=0;k<=4;k++){const S=SESS[i+k];if(!S||!HARD.has(S.type))continue;const h=k*24+t-S.e;if(h>=0&&h<=100)return{type:S.type,h}}return null}
function sess48(i,t){const out=new Set();for(let k=0;k<=2;k++){const S=SESS[i+k];if(!S)continue;const h=k*24+t-S.e;if(h>=0&&h<=48)out.add(S.type)}return out}
ATH.forEach(a=>{
  for(let i=DAYS-1;i>=0;i--){
    const cd=cdOf(a,i),per=cd!=null&&cd<5,S=SESS[i];
    const k=rnd()<a.p*(dow(i)>=5?.75:1)?(rnd()<.3?2:1):0;
    for(let n=0;n<k;n++){
      const r=rnd();let t=S&&r<.3?S.e+.3+rnd()*2.7:S&&r<.45?Math.max(6,S.s-.5-rnd()*2.5):r<.65?7+rnd()*2:19.5+rnd()*3;t=Math.min(t,23.9);
      const ls=lastSess(i,t),pre=S&&t<S.s&&S.s-t<=4;let eff=0;for(let q=0;q<=3;q++){const Sx=SESS[i+q];if(!Sx)continue;const hh=q*24+t-Sx.e;if(hh>=0)eff+=SEFF[Sx.type]*Math.exp(-hh/a.tau)}
      const load=eff+(rnd()-.4)*1.4+(per?1:0);let w;
      if(rnd()<a.frag*(1+eff/2))w=pick(['sharp','unstable']);
      else if(per&&rnd()<.5)w=pick(['crampy','heavy','bloated']);
      else if(load>1.8)w=pick(['sore','tight','heavy']);
      else w=rnd()<.55?pick(['strong','light']):pick(['tight','sore','heavy']);
      const pos=WORDS[w].pos,sym=!pos;
      const int=sym?clamp(Math.round(1+eff*1.2+(per?1.5*a.sens:0)+(WORDS[w].s==='r'?3:0)+rnd()*2.5),1,10):0;
      const en=rnd()<.12?null:clamp(Math.round(a.base-(per?.3+a.sens*.6:0)-(a.pms&&cd!=null&&cd>=21&&cd<=27?.5:0)-eff*.35-fat(i)+(CONG[i]?-.7:0)+(dow(i)===5?.4:0)+(rnd()-.5)*2),1,7);
      const zone=a.growth&&rnd()<.8?a.growth:(rnd()<.55?pick(a.weak):pick(LIMB));
      const zones=pos?['whole']:(w==='crampy'||w==='bloated'?['abdomen']:[zone]);
      const trig=sym?(()=>{const q=rnd();return a.growth&&q<.85?'movement':q<.55?'movement':q<.8?'pressure':'rest'})():null;
      a.ent.push({i,t,w,int,en,zones,trig,per,cd,ph:ls&&ls.h<=4?'post':pre?'pre':'none',stype:ls&&ls.h<=4?ls.type:pre?S.type:null,ls,lh:lastHard(i,t)});
    }
    if(k&&((per&&rnd()<.18)||rnd()<.015))a.pk.add(i);
  }
});

<div class="callout" style="margin-top:12px"><b>Observations, not diagnoses</b>Check-ins show where to look and when. The assessment stays clinical.</div></section>

<section class="card" id="sg"><div class="ch"><h2>Combined signals</h2><div class="note">athletes with 2+ signals at the same time · context signals shown separately</div></div>
<div class="tw"><table><thead><tr><th>Athlete</th><th>Signals</th><th>What is happening</th><th>Context</th></tr></thead><tbody>${sigRows}</tbody></table></div>
<p class="sub2" style="margin-top:10px">Signals: recurring area, red-flag sensation, painkillers 4+ days in 14, growth-related pattern, cycle flag, silence, energy drop, rising intensity. Context: season fatigue, slow recovery after matches.</p></section>

<section class="card" id="ep"><div class="ch"><h2>Flag episodes</h2><div class="note">yellow or red in the same area, gaps up to 3 days, at least 2 days · 15 most recent</div></div>
<div class="tw"><table><thead><tr><th>Athlete</th><th>Area</th><th>Dates</th><th>Days</th><th>Max</th><th>Trigger</th><th>Before the first check-in</th><th>Status</th></tr></thead><tbody>${epRows}</tbody></table></div>
<div class="grid" style="margin-top:14px"><div>${kv([['Episodes in 9 months',EP.length],['Open now',epOpen],['Average length',f1(epDays)+' days'],['With a red-flag word',pct(epRedShare)],...epByG.map(([g,c])=>['Area: '+g,c])])}</div>
<div><svg id="em"></svg><div class="legend"><span><i style="background:#A3202F"></i>new episodes per month</span></div></div></div></section>

<section class="card pad" id="on"><div class="ch"><h2>Sessions before the problem appears</h2><div class="note">sessions in the 48 h before the first check-in of each episode · ${EP.length} episodes</div></div>
<div class="tw"><table><thead><tr><th>Session</th><th>Before onsets</th><th>Before any check-in</th><th>Ratio</th></tr></thead><tbody>${onRows.map(([t,o,b])=>`<tr><td><b>${t}</b></td><td class="mono">${pct(o)}</td><td class="mono">${pct(b)}</td><td class="mono ${o/b>=1.3?'bd':''}">${b?(o/b).toFixed(1)+'×':'–'}</td></tr>`).join('')}</tbody></table></div>
${kv([['Training load in the previous 7 days',`${f1(ldOn)} against ${f1(ldAll)} on an average day`],['Onsets inside a congested spell',`${pct(congOn)} against ${pct(congAll)} of days`],['Hours since last hard session: 0–6 / 6–18 / 18–30 / 30–42 / 42–54 / 54+',hOn.join('% · ')+'%']])}
<p class="sub2" style="margin-top:10px">A ratio above 1 means the session comes before onsets more often than before other check-ins. It points to where to look, it does not show a cause. Load = sum of session weights (match 3, strength and speed 1.5, tactical 0.8).</p></section>

<section class="card pad" id="cr"><div class="ch"><h2>Hormonal Health</h2><div class="note">from period days and check-ins in the daily log</div></div>
<p class="lab">Cycle regularity</p>
${kv([['Regular',cyF('ok').length],['Wide variability',cyF('irr').length],['No period for 90+ days',cyF('absent').length],['Not enough periods logged',cyF('few').length]])}
${cyNon.length?`<div class="tw" style="margin-top:12px"><table><thead><tr><th>Athlete</th><th>Variability window</th><th>Age at menarche</th><th>Interval</th><th>Since last</th><th>Periods</th></tr></thead><tbody>${cyRows}</tbody></table></div>`:''}
<p class="sub2" style="margin-top:10px">Variability window = days between the shortest and the longest cycle. Regular means 3+ intervals between 21 and 38 days with a window under 10 days. In the first two years after menarche cycles can still vary a lot: read the numbers with age and time since menarche.</p>
<div style="border-top:1px solid var(--line-soft);margin:16px 0 14px"></div>
<div class="ch" style="margin-bottom:6px"><h2 style="font-size:14px">Cycle-Related Symptoms to keep an eye on</h2><div class="note">intense pain or symptoms (${INTENSE}/10 or more) in the 7 days before the period and during it</div></div>
${kv([['Check-ins with intense pain or symptoms, in the windows / on other days',`${pct(hxShare[0])} / ${pct(hxShare[1])}`],['Athletes with a repeated pattern',`<span class="bd">${hxAth.length}</span>`]])}
<div class="words" style="margin:12px 0 4px">${hxChips.map(([n,c])=>`<span class="word t${c?1:0}">${n} · ${c}</span>`).join('')}</div>
<p class="sub2">Athletes with a pattern, per category</p>
${hxAth.length?`<div class="tw"><table><thead><tr><th>Athlete</th><th>Cycles</th>${HCAT.map(c=>`<th>${c.n}</th>`).join('')}<th>When</th></tr></thead><tbody>${hxRows}</tbody></table></div>`:'<p class="sub2">No repeated pattern yet.</p>'}
<p class="sub2" style="margin-top:10px">A pattern means the same category reached ${INTENSE}/10 in at least ${PAT_MIN} complete cycles (${Math.round(PAT_FRAC*100)}% or more of them) and at least ${PAT_RATIO}× as often as outside these windows. A cycle window = 7 days before the period plus the period days, with at least 3 check-ins. Abdomen / lower back covers the classic areas; Joints = knee, ankle, hip, heel; Muscles = thigh, calf. A signal to read with the athlete, not a diagnosis.</p></section>
<section class="card pad" id="gr"><div class="ch"><h2>Growth-related pain</h2><div class="note">knee or heel, age ≤15, mostly on movement and after sessions</div></div>
${grRows?`<div class="tw"><table><thead><tr><th>Athlete</th><th>Age</th><th>Area</th><th>Check-ins</th><th>On movement</th><th>After session</th><th>Intensity</th></tr></thead><tbody>${grRows}</tbody></table></div>`:'<p class="sub2">No athlete with this pattern.</p>'}
<p class="sub2" style="margin-top:10px">A recurring pattern, not a diagnosis. Needs 5+ knee or heel check-ins in 14 days, 75% on movement, 60% within 24 h of a session.</p></section>

<div class="grid">
<section class="card pad" id="zn"><div class="ch"><h2>Recurring areas</h2><div class="note">athletes with 2+ check-ins in the area, last 30 days</div></div><div class="zones">${zrows(zrowsData,'Yellow or red check-ins (%)')}</div>
<div class="legend" style="margin-top:12px"><span><i style="background:${TC[0]}"></i>movement</span><span><i style="background:${TC[1]}"></i>pressure</span><span><i style="background:${TC[2]}"></i>rest</span></div>
${trigRows.map(([g,p])=>`<div class="kv"><div><span>${g}</span><b>${p.join('% · ')}%</b></div></div><div class="stk" style="margin:2px 0 8px">${p.map((v,i)=>`<i style="width:${v}%;background:${TC[i]}"></i>`).join('')}</div>`).join('')}</section>
</div>

<div class="grid" id="pk">
<section class="card pad"><div class="ch"><h2>Painkillers</h2><div class="note">from the daily log</div></div>
${kv([['Athletes with at least one use, 30 days',`${pk30} of ${N}`],['Frequent use (4+ days in 14)',`<span class="bd">${pkFreq} athletes</span>`],['Used on a match day, 90 days',`${pkMatch} athletes`],['Days with use, period days / other days',`${pct(pkPer[0])} / ${pct(pkPer[1])}`]])}
<div class="callout" style="margin-top:12px"><b>Pain can be under-reported</b>On days with a painkiller the reported intensity may be lower than the real one: read the two together.</div></section>
<section class="card pad"><div class="ch"><h2>Cycle and symptoms</h2><div class="note">same athlete: period days against other days</div></div>
${kv([['Intensity, average',`${f1(avg(perAth.map(a=>a.m.cyc.pInt)))} against ${f1(avg(perAth.map(a=>a.m.cyc.oInt)))}`],['Energy, average',`${f1(avg(perAth.map(a=>a.m.cyc.pEn)))} against ${f1(avg(perAth.map(a=>a.m.cyc.oEn)))}`],['Athletes with higher / same / lower intensity',`${cyHi} / ${perAth.length-cyHi-cyLo} / ${cyLo}`]])}
<p class="sub2" style="margin-top:12px">Most frequent words on period days (athletes)</p><div class="words">${cyWords.map(([w,c])=>`<span class="word t${TIER[WORDS[w].s]}">${WORDS[w].n} · ${c}</span>`).join('')}</div></section></div>

<section class="card" id="par"><div class="ch"><h2>Words to watch</h2><div class="note">athletes who used each word, last 30 days · change on the month before</div></div>
<div class="words">${wRows.map(x=>`<span class="word t${TIER[WORDS[x.w].s]}">${WORDS[x.w].n} · ${x.now}${x.now!==x.prev?` ${x.now>x.prev?'▲':'▼'}${Math.abs(x.now-x.prev)}`:''}</span>`).join('')}</div></section>

<section class="card pad" id="hs"><div class="ch"><h2>Recurring areas over 9 months</h2><div class="note">athletes with a yellow or red check-in in the area, per 30 days</div></div><svg id="hh"></svg>
<div class="legend">${topG.map((g,i)=>`<span><i style="background:${['#A3202F','#5346C4','#0A7364'][i]}"></i>${g}</span>`).join('')}</div></section>
<div style="font-size:12.5px;color:var(--ink-2);padding:0 2px">Identifiable health data, shared with the technical and medical staff only. Sample data generated to show the layout.</div>`});
line($('#hh'),mLab,hist.map((v,i)=>({v,c:['#A3202F','#5346C4','#0A7364'][i]})),[0,Math.max(4,...hist.flat())+1,2]);
line($('#em'),mLab,[{v:epMonth,c:'#A3202F'}],[0,Math.max(4,...epMonth)+1,Math.max(2,Math.round(Math.max(...epMonth)/4))]);
wireCommon(id=>openOver(detail(ATH[id])));
</script>

</body></html>
